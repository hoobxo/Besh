<!doctype html><html lang="zh-CN"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48 64x64" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" /><title>Besh</title></head><body>
    <script>
      // Applied before paint so a dark system never flashes light while the app loads.
      try {
        var choice = localStorage.getItem("besh:theme");
        var dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (error) {}
    </script><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
